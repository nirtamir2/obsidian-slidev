name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build draft release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const readJson = async (file) =>
            JSON.parse(await readFile(file, "utf8"));
          const [packageJson, manifest, versions] = await Promise.all([
            readJson("package.json"),
            readJson("manifest.json"),
            readJson("versions.json"),
          ]);
          const tag = process.env.RELEASE_TAG;

          if (!/^\d+\.\d+\.\d+$/.test(tag ?? "")) {
            throw new Error(`Release tag must use x.y.z format; received ${tag}`);
          }
          if (packageJson.version !== tag || manifest.version !== tag) {
            throw new Error(
              `Tag ${tag} must match package.json (${packageJson.version}) and manifest.json (${manifest.version})`,
            );
          }
          if (versions[tag] !== manifest.minAppVersion) {
            throw new Error(
              `versions.json must map ${tag} to ${manifest.minAppVersion}`,
            );
          }
          NODE

      - name: Lint
        run: pnpm exec eslint "**/*.{ts,tsx,js,jsx,json}"

      - name: Check formatting
        run: pnpm exec prettier "**/*" --check --ignore-unknown

      - name: Type-check
        run: pnpm run type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify build assets
        run: pnpm run verify:build

      - name: Verify supported release assets
        run: |
          test -s dist/main.js
          test -s dist/manifest.json
          test -s dist/styles.css
          cmp manifest.json dist/manifest.json

      - name: Attest release assets
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --title "$RELEASE_TAG" \
            dist/main.js \
            dist/manifest.json \
            dist/styles.css
